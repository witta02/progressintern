<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ProIM</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Mitr', 'Kanit', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              brand: {
                accent: {
                  DEFAULT: 'var(--color-brand-accent, #6366f1)',
                  teal: 'var(--color-brand-accent-teal, #0ea5e9)',
                  'teal-dim': 'var(--color-brand-accent-teal-dim, rgba(14, 165, 233, 0.1))',
                  'indigo-dim': 'var(--color-brand-accent-indigo-dim, rgba(99, 102, 241, 0.1))',
                },
              },
            },
            boxShadow: {
              'glow-teal': 'var(--shadow-glow-teal, 0 0 20px rgba(14, 165, 233, 0.15))',
              'glow-indigo': 'var(--shadow-glow-indigo, 0 0 20px rgba(99, 102, 241, 0.15))',
              glass: '0 8px 32px 0 rgba(31, 38, 135, 0.05)',
            },
          },
        },
      };
    </script>
    <style>
      /* Force regular Mitr font weight globally across all tags and Tailwind helpers */
      .font-black,
      .font-extrabold,
      .font-bold,
      .font-semibold,
      .font-medium,
      .font-normal {
        font-weight: 400 !important;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      th,
      td,
      button,
      select,
      input,
      textarea,
      label,
      span,
      p,
      a,
      div {
        font-weight: 400 !important;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-900 font-sans antialiased relative"
    style="font-family: 'Mitr', 'Kanit', sans-serif"
  >
    <!-- 3D Particle Scene Container (CSS Parallax + Canvas) -->
    <div
      id="immersive-background"
      class="fixed inset-0 z-[-1] pointer-events-none overflow-hidden bg-slate-50"
    >
      <!-- CSS Parallax Blobs -->
      <div
        class="parallax-blob w-96 h-96 bg-indigo-300 rounded-full mix-blend-multiply opacity-30"
        style="top: -10%; left: -10%; animation: float 15s ease-in-out infinite"
      ></div>
      <div
        class="parallax-blob w-96 h-96 bg-teal-300 rounded-full mix-blend-multiply opacity-30"
        style="top: 40%; right: -10%; animation: float 20s ease-in-out infinite alternate"
      ></div>
      <div
        class="parallax-blob w-80 h-80 bg-purple-300 rounded-full mix-blend-multiply opacity-30"
        style="bottom: -10%; left: 20%; animation: float 18s ease-in-out infinite"
      ></div>

      <!-- Three.js Canvas Container -->
      <div id="three-canvas-container" class="absolute inset-0"></div>
    </div>

    <app-root></app-root>

    <!-- Basic Three.js Particle Setup -->
    <script>
      // Only init Three.js if not on reduced motion
      if (
        window.matchMedia &&
        !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
        typeof THREE !== 'undefined'
      ) {
        const container = document.getElementById('three-canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Create particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 300;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
          posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
          size: 0.02,
          color: 0x6366f1,
          transparent: true,
          opacity: 0.4,
          blending: THREE.AdditiveBlending,
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        camera.position.z = 3;

        // Animation Loop
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
          mouseX = event.clientX - windowHalfX;
          mouseY = event.clientY - windowHalfY;
        });

        function animate() {
          requestAnimationFrame(animate);

          targetX = mouseX * 0.001;
          targetY = mouseY * 0.001;

          particlesMesh.rotation.y += 0.001;
          particlesMesh.rotation.x += 0.0005;

          particlesMesh.rotation.y += 0.05 * (targetX - particlesMesh.rotation.y);
          particlesMesh.rotation.x += 0.05 * (targetY - particlesMesh.rotation.x);

          renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }
    </script>
  </body>
</html>
